# 云服务器自动部署：push main 即部署（构建在服务器上做——国内云从镜像仓库拉取不可靠，不采用 CI 构建镜像方案）
#
# 一次性准备（GitHub 仓库 Settings → Secrets and variables → Actions 添加 4 个 secret）：
#   SSH_HOST         服务器 IP
#   SSH_USER         SSH 登录用户
#   SSH_PRIVATE_KEY  专用私钥全文（对应公钥追加到服务器 ~/.ssh/authorized_keys）
#   DEPLOY_DIR       服务器上本仓库的绝对路径
# 前置：百度云安全组放行 22 端口（GitHub 构建机 IP 段宽，无法只放行 Actions）
# 注意：容器重建有几秒服务中断，上课期间不要 push main
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 手动触发：Actions 页面点 Run workflow

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 排队串行部署，不打断进行中的构建

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH 部署（git pull + compose 重建）
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true   # 任一命令失败即中止（等效 set -e），失败时旧容器继续运行
          envs: DEPLOY_DIR
          script: |
            cd "$DEPLOY_DIR"
            git pull --ff-only
            docker compose -f deploy/docker-compose.yml up -d --build
            docker image prune -f   # 清理重建产生的悬空镜像，防磁盘慢慢吃满
            docker compose -f deploy/docker-compose.yml ps
